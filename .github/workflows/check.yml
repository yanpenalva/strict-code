name: check

on:
  push:
    paths:
      - "**/*.md"
      - "bin/**"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "bin/**"

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rule consistency
        run: python3 bin/strict-code-check .
